<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Listen to seismic waves from Earth and Mars with Earthtunes.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F7F2FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#211F26" media="(prefers-color-scheme: dark)">
  <style>
    :root {
      --earthtunes-page-background: #F7F2FA;
      --earthtunes-app-surface: #FFFBFE;
      --earthtunes-frame-border: #CAC4D0;
      --earthtunes-frame-shadow: rgba(29, 25, 43, 0.18);
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--earthtunes-page-background);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    #earthtunes-frame {
      box-sizing: border-box;
      width: 100%;
    }

    #earthtunes-host {
      box-sizing: border-box;
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--earthtunes-app-surface);
    }

    @media (min-width: 960.01px) {
      #earthtunes-frame {
        width: 960px;
        margin: 0 auto;
        padding: 16px;
        overflow: hidden;
      }

      #earthtunes-host {
        border: 1px solid var(--earthtunes-frame-border);
        border-radius: 22px;
        box-shadow: 0 4px 14px var(--earthtunes-frame-shadow);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --earthtunes-page-background: #211F26;
        --earthtunes-app-surface: #141218;
        --earthtunes-frame-border: #49454F;
        --earthtunes-frame-shadow: rgba(0, 0, 0, 0.55);
      }
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Earthtunes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>Earthtunes</title>
  <link rel="manifest" href="manifest.json">
  <script src="earthtunes_mseed.js"></script>
</head>
<body>
  <main id="earthtunes-frame">
    <div id="earthtunes-host"></div>
  </main>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
